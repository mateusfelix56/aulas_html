<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&"/>
    <link rel="stylesheet" href="mobile.css">
    <link rel="stylesheet" href="media.css" media="screen and (min-width: 768px) and (max-width: 1000px)">
    <link rel="stylesheet" href="grande.css" media="screen and (min-width: 1001px)">
    
</head>
<body>
    <main>
        <section id="imagem">

        </section>
        <section id="formulario">
            <h1>Login</h1>
            <p>
                Seja bem-vindo(a) novamente. Faça login para acessar sua conta e poder fazer as configurações no seu ambiemte.
            </p>
            <form action="conta.py" method="post">
                <div>
                    <span class="material-symbols-outlined">person</span>
                    <input type="email" name="emai" id="iemail" required autocomplete="email" placeholder="Seu E-mail">
                    
                </div>
                <div>
                    <span class="material-symbols-outlined">vpn_key</span>
                    <input type="password" name="senha" id="isenha" required autocomplete="current-password" placeholder="Sua senha" minlength="5">
                </div>
                <input type="submit" value="Enviar">
                <a href="#">Esqueci minha senha <span class="material-symbols-outlined">mail</span></a>
                
            </form>
        </section>
    </main>
</body>
</html>
