<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table{
            font-family: Arial, Helvetica, sans-serif;
            border-collapse: collapse;
            margin: auto;
            background-color: rgb(230, 228, 228);
            
        }
        caption{
            padding: 10px;
            font-weight: bold;
            font-size: 1.5em;
            background-color: rgb(172, 172, 172);
            border-radius: 40px 40px 0 0;
        }
        td, th{
            border: 2px solid black;
            padding: 5px;
            text-align: center;
            
        }
        .grupo{
            width: 100px;
        }
    </style>
</head>
<body>
    <table>
        <caption>Filmes favoritos</caption>
        <tr>
            <th class="grupo" scope="col">Grupo</th>
            <th scope="col">Nomes</th>
            <th colspan="3" scope="colgroup">Filmes</th>
        </tr>
        <tr>
            <th rowspan="3" class="grupo" scope="rowgroup">Mulheres</th>
            <td>Ana Maria Santos</td>
            <td>Alien</td>
            <td>Rambo</td>
            <td>Vingadores</td>
        </tr>
        <tr>
            <td>Beatriz Souza</td>
            <td>Hulk</td>
            <td>Inception</td>
            <td>Batman</td>
            
        </tr>
        <tr>
            <td>Cláudia Melo</td>
            <td>Oblivion</td>
            <td>Matrix</td>
            <td>Big Hero</td>
            
        </tr>
        <tr>
            <th rowspan="3" class="grupo" scope="rowgroup">Homens</th>
            <td>Bruno Mendonça</td>
            <td>Intocéveis</td>
            <td>Amnésia</td>
            <td>Gladiador</td>
        </tr>
        <tr>
            <td>Daniel Lorenço</td>
            <td>Wall-E</td>
            <td>Oldboy</td>
            <td>Dangal</td>
            
        </tr>
        <tr>
            <td>Fabio Mota</td>
            <td>Star Wars 5</td>
            <td>Taxi Driver</td>
            <td>Toy Story</td>
            
        </tr>
    </table>
</body>
</html>
