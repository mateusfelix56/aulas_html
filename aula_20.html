<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagens de fundo</title>
    <style>
        div.bloco{
            border: 2px solid black;
            background-image: url(imagens_html/wallpaper003.jpg);
            height: 300px;
            width: 80%;
            margin: 10px;
        }
        div#q1{
            background-position: left top;
        }
        div#q2{
            background-position: top right;
        }
        div#q3{
            background-position: right bottom;
        }
        div#q4{
            background-position: bottom left;
        }
        div#q5{
            background-position: center left;
        }
        div#q6{
            background-position: center top;
        }
        div#q7{
            background-position: center right;
        }
        div#q8{
            background-position: center bottom;
        }
        div#q9{
            background-position: center center;
        }
    </style>

</head>
<body>
    <div class="bloco" id="q1"></div>
    <div class="bloco" id="q2"></div>
    <div class="bloco" id="q3"></div>
    <div class="bloco" id="q4"></div>
    <div class="bloco" id="q5"></div>
    <div class="bloco" id="q6"></div>
    <div class="bloco" id="q7"></div>
    <div class="bloco" id="q8"></div>
    <div class="bloco" id="q9"></div>
    
</body>
</html>
