<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box</title>
    <style>
        .container{
            display: flex;
            background-color: blueviolet;
            flex-flow: row nowrap;
            height: 500px;
            align-items: center;
        }
        .item{
            background-color: lightgreen;
            border: 1px solid black;
            width: 150px;
        }
        #i1{
            align-self: center;

        }
        #i2{
            align-self: flex-end;

        }
        #i3{
            align-self: auto;

        }
        #i4{
            align-self: flex-start;

        }
        #i5{
            align-self: stretch;

        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="i1">
            A
        </div>
        <div class="item" id="i2">
            B
        </div>
        <div class="item" id="i3">
            C  
        </div>
        <div class="item" id="i4">
            D
        </div>
        <div class="item" id="i5">
            E
        </div>
    </div>
</body>
</html>
