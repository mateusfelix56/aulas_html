<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box</title>
    <style>
        .container{
            display: flex;
            background-color: blueviolet;
            height: 400px;
            width: 500px;
            margin: auto;
        }
        .item{
            background-color: lightgreen;
            border: 1px solid black;
            height: 50px;
            margin: auto;
            flex: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">
            A
        </div>
        <div class="item">
            B
        </div>
        <div class="item">
            C  
        </div>
        <div class="item">
            D
        </div>
        <div class="item">
            E
        </div>
    </div>
</body>
</html>
