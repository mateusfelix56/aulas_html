<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box</title>
    <style>
        .container{
            display: flex;
            background-color: blueviolet;
            flex-flow: row nowrap;
        }
        .item{
            background-color: lightgreen;
            border: 1px solid black;
            flex-basis: 200px;
            flex-shrink: 0;
            flex-grow: 0;
            text-align: center;
            /* Outros valores para flex 
                flex: inicial = flex: 0 1 auto
                flex: none = flex: 0 0 auto
                flex: auto = flex: 1 1 auto */
        }
        #a{
            flex: 0 1 200px; /* Grow > Shrink > Basis */
            
        }
        #b{
            flex: 2 0 200px;
        }
        #c{
            flex: 1 2 200px;
        }
    </style>
</head>
<body>
    <div class="caixa">
        <div class="container">
            <div class="item" id="a">
                A
            </div>
            <div class="item" id="b">
                B
            </div>
            <div class="item" id="c">
                C
            </div>
        
        </div>
    </div>
</body>
</html>
