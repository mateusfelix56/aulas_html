<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h1>Outro formulario</h1>
    <form action="python.py" method="get">
        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" name="sex" id="imas" checked> <label for="imas"> Masculino</label>
            <br>
            <input type="radio" name="sex" id="ifem"> <label for="ifem"> Feminino</label>
        </fieldset>
        <fieldset>
            <legend>Esporte favorito</legend>
            <input type="checkbox" name="bas" id="ibas" checked> <label for="ibas">Basquete</label> <br>          
            <input type="checkbox" name="fut" id="ifut"> <label for="ifut">Futebol</label> <br>            
            <input type="checkbox" name="nat" id="inat"> <label for="inat">Natação</label> <br>
            <input type="checkbox" name="ten" id="iten" checked> <label for="iten">Tenis</label> <br>
        </fieldset>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p> 
    </form>
</body>
</html>
