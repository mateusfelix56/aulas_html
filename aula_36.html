<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    
</head>
<body>
    <h1>Mais formularios</h1>
    <form action="python.py" method="get" autocomplete="on">
        <p>
            <label for="inome">Nome: </label>
            <input type="text" name="nome" id="inome" placeholder="Nome completo" autocomplete="name" required>  
        </p>
        <p>
            <label for="imedia">Média: </label>
            <input type="number" name="media" id="imedia" required placeholder="Insira sua média" min="0" max="10" step="0.1">
        </p>
        <p>
            <label for="imes">Periodo letivo: </label>
            <input type="date" name="mes" id="imes" value="2022-10-24">
        </p>
        <p>
            <label for="ihora">Horario da prova: </label>
            <input type="time" name="hora" id="ihora" value="20:30">
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
