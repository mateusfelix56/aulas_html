<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midias em HTML 5</title>
    
</head>

<body>

    <picture>
        
        <source media="(min-width: 1000px)" srcset="imagens_html/foto-g.png" type="image/png">
        <source media="(min-width: 700px)" srcset="imagens_html/foto-m.png" type="image/png">
        <img src="imagens_html/foto-p.png" alt="">

    </picture>
    <h1>Reprodução de audio</h1>
    <audio preload="metadata" controls autoplay>
        
        <source src="audios_html/Kuntry Boy - Anno Domini Beats.mp3" type="audio/mpeg">
        <source src="audios_html/Kuntry Boy - Anno Domini Beats.ogg" type="audio/ogg">
        <source src="audios_html/Kuntry Boy - Anno Domini Beats.wav" type="audio/wav">

    </audio>
    <audio src="audios_html/Lost Myself - Lalanne.mp3" controls></audio>

</body>


</html>
