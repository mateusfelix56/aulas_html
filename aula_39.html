<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h1>Formulario outra vez</h1>
    <form action="python.py" method="post">
        <p>
            <label for="icor">Cor: </label>
            <input type="color" name="cor" id="icor" value="rgb(104, 204, 104)">
        </p>
        <p>
            <label for="ibarra">Barra: </label>
            <input type="range" name="barra" id="ibarra" value="1" min="0" max="5">
        </p>
        <p>
            <label for="ifoto">Foto: </label>
            <input type="file" name="foto" id="ifoto">
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
