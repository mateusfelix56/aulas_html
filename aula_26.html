<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesclagem de celulas</title>
    <style>
        table{
            width: 300px;
            border-collapse: collapse;
            text-align: center;
        }
        td{
            border: solid 2px black;
            height: 50px;
            
        }
    </style>
<body>
    <h1>Mesclagem de celulas</h1>
    <table>
        <tr>
            
            <td colspan="3">B</td>
            
        </tr>
        <tr>
            <td>D</td>
            <td colspan="1" rowspan="2">E</td>
            <td>F</td>
        </tr>
        <tr>
            <td rowspan="2">G</td>
            
            <td>I</td>
        </tr>
        <tr>
            
            <td colspan="2">K</td>
            
        </tr>
    </table>
</body>
</html>
